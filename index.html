<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7ff"><title>Expense Tracker · Capybara</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101a3d;background:#f5f7fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.app{max-width:1180px;margin:34px auto;min-height:calc(100vh - 68px);display:grid;grid-template-columns:245px 1fr;background:white;border:1px solid #e8e9f3;border-radius:30px;box-shadow:0 18px 55px #29336a14;overflow:hidden}.sidebar{background:#f7f8ff;border-right:1px solid #e9ebf5;padding:28px 17px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.6px}.mascot{width:70px;height:65px;flex:none}.brand .mascot{width:56px;height:52px}.nav{display:grid;gap:8px}.nav button,.bottom-nav button{border:0;background:transparent;color:#596078;display:flex;align-items:center;gap:12px;padding:14px;border-radius:15px;font-weight:650;text-align:left}.nav button.active,.bottom-nav button.active{background:#ecebff;color:#4843c7}.nav button:hover,.bottom-nav button:hover{background:#eeeefe}.nav svg,.bottom-nav svg{width:21px;height:21px}.sidebar-note{margin-top:auto;padding:17px;background:white;border-radius:17px;font-size:13px;color:#66708b;line-height:1.6}.content{min-width:0;padding:0 36px 44px}.hero{height:165px;margin:0 -36px 25px;padding:28px 36px;background:linear-gradient(155deg,#e5f0ff,#f8fbff 65%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between}.hero:after{content:"";position:absolute;bottom:-45px;left:-5%;width:110%;height:80px;background:#d9f3d7;border-radius:50%}.hero>*{z-index:1}.hero h1{font-size:29px;margin:0 0 6px;letter-spacing:-1px}.hero p{margin:0;color:#68728b;font-size:14px}.hero .mascot{width:112px;height:105px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:13px;color:#65708a;font-weight:650}.month-card{border-radius:23px;background:linear-gradient(120deg,#e9f2ff,#e5f0ff);padding:22px 25px;margin-bottom:19px;display:flex;align-items:center;justify-content:space-between}.month-card strong{display:block;font-size:34px;letter-spacing:-1.2px;margin-top:7px}.month-card .month{font-weight:750;font-size:17px}.bars{display:flex;align-items:end;gap:6px;height:65px}.bars span{width:14px;border-radius:7px 7px 3px 3px;background:linear-gradient(#8fb6ff,#4c66cf)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:29px}.stat{border-radius:20px;padding:19px 12px;text-align:center}.stat:nth-child(1){background:#fff0f1}.stat:nth-child(2){background:#eaf5ff}.stat:nth-child(3){background:#eaf9eb}.stat .emoji{font-size:25px}.stat .name{font-size:13px;margin:8px 0 3px}.stat strong{font-size:18px;white-space:nowrap}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.section-head h2{font-size:21px;margin:0;letter-spacing:-.5px}.text-btn{border:0;background:transparent;color:#3631b2;font-weight:750}.expense-list{display:grid;gap:9px}.expense{border:1px solid #e9eaf0;border-radius:17px;padding:12px;display:flex;align-items:center;gap:13px;background:#fff}.cat-icon{width:51px;height:51px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}.expense-info{min-width:0;flex:1}.expense-info strong{display:block;font-size:15px}.expense-info small{display:block;color:#6b7289;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.expense-amount{font-weight:800;white-space:nowrap}.icon-btn{border:0;background:transparent;color:#666b83;padding:8px;border-radius:10px}.icon-btn:hover{background:#f1f1fb}.actions{display:flex;align-items:center;gap:2px}.primary{border:0;border-radius:15px;background:#5049c9;color:white;padding:15px 22px;font-weight:750;box-shadow:0 5px 14px #5049c922}.primary:hover{background:#423cb4}.secondary{border:1px solid #cbd0df;border-radius:15px;background:white;color:#343b59;padding:14px 22px;font-weight:750}.wide{width:100%}.dashboard-add{margin-top:22px}.empty{text-align:center;padding:35px 20px;color:#68718a}.empty .art{font-size:55px}.empty h3{color:#111b3d;margin:12px 0 6px}.empty p{line-height:1.55}.empty .primary{margin-top:12px}.form-wrap{max-width:600px;margin:0 auto}.form-head{display:flex;align-items:center;gap:14px;margin:4px 0 14px}.form-head h2{font-size:25px;margin:0}.form-art{text-align:center;margin:5px 0 20px}.form-art .mascot{width:130px;height:120px}.field{margin-bottom:20px}.field label{display:block;font-size:16px;font-weight:750;margin-bottom:8px}.required{color:#e53c42}.input-shell{display:flex;align-items:center;border:2px solid #e0e3ed;border-radius:13px;padding:0 13px;background:white}.input-shell:focus-within{border-color:#6b65d8}.input-shell .prefix{color:#6d7184;font-size:21px;margin-right:10px}.input-shell input,.input-shell select{height:51px;border:0;outline:0;background:transparent;width:100%;min-width:0;color:#171d35}.input-shell select{cursor:pointer}.field.invalid .input-shell{border-color:#ed414a}.error{font-size:13px;color:#d52231;margin:7px 0 0;display:none}.field.invalid .error{display:block}.form-actions{display:flex;gap:12px;margin-top:35px}.form-actions>*{flex:1}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.filters input,.filters select{border:1px solid #dce0ea;background:white;border-radius:12px;padding:12px;color:#222a47;max-width:100%}.filters input{flex:1;min-width:180px}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.summary-box{border:1px solid #e7e9f2;border-radius:18px;padding:20px;background:#fafbff}.summary-box span{color:#68728b;font-size:13px}.summary-box strong{display:block;font-size:24px;margin-top:9px}.breakdown{margin-top:28px}.break-row{display:grid;grid-template-columns:135px 1fr 105px;align-items:center;gap:14px;margin:17px 0;font-size:13px}.track{height:12px;background:#edf0f7;border-radius:15px;overflow:hidden}.fill{height:100%;background:#6862d6;border-radius:15px}.settings-card{border:1px solid #e7e9f2;border-radius:18px;padding:22px;max-width:600px}.settings-card p{color:#68728b;line-height:1.6}.danger{background:#fff;color:#c12c37;border:1px solid #efb8bc;border-radius:12px;padding:12px 17px;font-weight:750}.bottom-nav{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d2441;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 10px 25px #0002;z-index:20}.hidden{display:none!important}dialog{border:0;border-radius:22px;padding:27px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 25px 90px #101a3d40;color:#101a3d}dialog::backdrop{background:#101a3d77}dialog p{color:#606a82;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:800px){.app{margin:0;min-height:100dvh;border:0;border-radius:0;display:block;box-shadow:none}.sidebar{display:none}.content{padding:0 20px 110px}.hero{margin:0 -20px 22px;padding:24px 20px;height:160px}.hero h1{font-size:25px}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #ececf5;display:flex;justify-content:space-around;padding:8px 6px max(9px,env(safe-area-inset-bottom))}.bottom-nav button{flex-direction:column;gap:3px;padding:7px 10px;font-size:11px}.bottom-nav svg{width:23px;height:23px}.month-card strong{font-size:29px}}@media(max-width:410px){.stats{gap:8px}.stat{padding:15px 4px}.stat strong{font-size:15px}.stat .name{font-size:12px}.expense{gap:8px;padding:9px}.cat-icon{width:43px;height:43px}.expense-info strong{font-size:13px}.expense-amount{font-size:13px}.break-row{grid-template-columns:100px 1fr 80px;gap:8px}.summary-grid{grid-template-columns:1fr}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="capy" viewBox="0 0 150 135"><path d="M18 109 Q15 82 30 49 Q37 33 51 29 L55 17 Q62 11 69 24 Q87 19 101 30 L111 21 Q120 19 123 33 Q137 44 135 62 Q137 78 121 85 L110 108 Q102 119 87 114 L55 115 Q40 122 18 109Z" fill="#dca468" stroke="#653b20" stroke-width="3.5" stroke-linejoin="round"/><path d="M101 53 Q119 48 132 59 Q141 72 128 82 Q115 87 106 77" fill="#e7b784" stroke="#653b20" stroke-width="3"/><circle cx="90" cy="48" r="3.5" fill="#352419"/><circle cx="128" cy="67" r="3" fill="#653b20"/><path d="M55 89 Q73 85 79 96 Q85 106 75 111" fill="none" stroke="#653b20" stroke-width="3" stroke-linecap="round"/><path d="M33 110 Q38 102 45 107" fill="none" stroke="#653b20" stroke-width="3" stroke-linecap="round"/><rect x="89" y="89" width="33" height="33" rx="7" fill="#fff8df" stroke="#653b20" stroke-width="3"/><path d="M122 97 Q139 94 138 105 Q137 115 122 113" fill="none" stroke="#653b20" stroke-width="3"/></symbol></svg>
<div class="app"><aside class="sidebar"><div class="brand"><svg class="mascot"><use href="#capy"/></svg><span>Expense Tracker</span></div><nav class="nav" id="sideNav"></nav><div class="sidebar-note">☕ Small expenses add up. Keep track of your spending, one entry at a time.<br><br>🔒 Saved on this device only.</div></aside><main class="content"><div id="appView"></div></main></div><nav class="bottom-nav" id="bottomNav"></nav><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><dialog id="confirmDialog"><h2 id="dialogTitle">Delete expense?</h2><p id="dialogText">This action cannot be undone.</p><div class="dialog-actions"><button class="secondary" id="dialogCancel">Cancel</button><button class="danger" id="dialogConfirm">Delete</button></div></dialog>
<script>
(()=>{'use strict';
const KEY='capy-expenses-v1',CATS={'Food & Drinks':{icon:'🍴',bg:'#fff0da'},Transport:{icon:'🚌',bg:'#d8f0ff'},Shopping:{icon:'🛍️',bg:'#eee2ff'},Bills:{icon:'🧾',bg:'#ffe6e8'},Entertainment:{icon:'🎬',bg:'#e7e5ff'},Others:{icon:'✨',bg:'#e6f5e9'}};
const icons={Home:'⌂',History:'▤',Summary:'▥',Settings:'⚙'};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());const shift=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const seed=()=>[{id:'demo1',amount:8.5,category:'Food & Drinks',date:today(),description:'Lunch with team',createdAt:new Date().toISOString()},{id:'demo2',amount:4,category:'Transport',date:today(),description:'Bus fare',createdAt:new Date(Date.now()-3600000).toISOString()},{id:'demo3',amount:28.9,category:'Shopping',date:shift(-1),description:'Household essentials',createdAt:new Date(Date.now()-86400000).toISOString()},{id:'demo4',amount:68.9,category:'Bills',date:shift(-3),description:'Mobile plan',createdAt:new Date(Date.now()-259200000).toISOString()},{id:'demo5',amount:39.8,category:'Entertainment',date:shift(-6),description:'Movie night',createdAt:new Date(Date.now()-518400000).toISOString()}];
let expenses;try{const raw=localStorage.getItem(KEY);expenses=raw===null?seed():JSON.parse(raw);if(!Array.isArray(expenses))expenses=seed()}catch{expenses=seed()};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(expenses));return true}catch{notify('Browser storage is unavailable. Changes may not persist.');return false}};if(localStorage.getItem(KEY)===null)persist();
let view='Home',editing=null,filter='',search='',period='month';const $=s=>document.querySelector(s),money=n=>'SGD '+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const niceDate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});const sorted=()=>[...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));const startWeek=()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d)};const total=(mode)=>{const now=today(),week=startWeek(),month=now.slice(0,7);return expenses.filter(e=>mode==='today'?e.date===now:mode==='week'?e.date>=week&&e.date<=now:mode==='month'?e.date.slice(0,7)===month:e.date<=now).reduce((s,e)=>s+Number(e.amount),0)};
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),3000)}
function nav(){const html=Object.keys(icons).map(n=>`<button type="button" data-nav="${n}" class="${view===n?'active':''}" aria-current="${view===n?'page':'false'}"><span style="font-size:23px;line-height:1">${icons[n]}</span><span>${n}</span></button>`).join('');$('#sideNav').innerHTML=html;$('#bottomNav').innerHTML=html}
function go(v){view=v;editing=null;render();window.scrollTo(0,0)}
function hero(title,sub){return `<header class="hero"><div><h1>${title}</h1><p>${sub}</p></div><svg class="mascot" aria-label="Friendly capybara mascot"><use href="#capy"/></svg></header>`}
function expenseItem(e){const c=CATS[e.category]||CATS.Others;return `<article class="expense"><div class="cat-icon" style="background:${c.bg}">${c.icon}</div><div class="expense-info"><strong>${esc(e.category)}</strong><small>${niceDate(e.date)}${e.description?' · '+esc(e.description):''}</small></div><span class="expense-amount">${money(e.amount)}</span><div class="actions"><button class="icon-btn" data-edit="${esc(e.id)}" aria-label="Edit expense" title="Edit">✎</button><button class="icon-btn" data-delete="${esc(e.id)}" aria-label="Delete expense" title="Delete">🗑</button></div></article>`}
function empty(){return `<div class="empty"><div class="art">📋</div><h3>No expenses yet</h3><p>Start tracking your spending to see it here.</p><button class="primary" data-add>＋ Add Expense</button></div>`}
function dashboard(){const month=new Date().toLocaleDateString('en-SG',{month:'short',year:'numeric'});return hero('Expense Tracker','Your daily spending, made simple')+`<section class="month-card"><div><span class="month">▦ ${month}</span><strong>${money(total('month'))}</strong><span class="eyebrow">Spent this month</span></div><div class="bars" aria-hidden="true"><span style="height:28px"></span><span style="height:43px"></span><span style="height:59px"></span></div></section><div class="stats">${[['Today','today','🗓️'],['This Week','week','📅'],['This Month','month','🗓️']].map(([n,k,i])=>`<div class="stat"><div class="emoji">${i}</div><div class="name">${n}</div><strong>${money(total(k))}</strong></div>`).join('')}</div><div class="section-head"><h2>Recent Expenses</h2><button class="text-btn" data-nav="History">View All ›</button></div><div class="expense-list">${expenses.length?sorted().slice(0,4).map(expenseItem).join(''):empty()}</div><button class="primary wide dashboard-add" data-add>＋ Add Expense</button>`}
function form(){const e=editing?expenses.find(x=>x.id===editing):null;return `<div class="form-wrap"><div class="form-head"><button class="icon-btn" data-back aria-label="Go back" style="font-size:26px">←</button><h2>${e?'Edit Expense':'Add Expense'}</h2></div><div class="form-art"><svg class="mascot" aria-label="Capybara with a mug"><use href="#capy"/></svg></div><form id="expenseForm" novalidate><div class="field" id="amountField"><label for="amount">Amount (SGD) <span class="required">*</span></label><div class="input-shell"><span class="prefix">▣</span><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" value="${e?esc(e.amount):''}"></div><p class="error" id="amountError">Please enter an amount greater than zero.</p></div><div class="field" id="categoryField"><label for="category">Category <span class="required">*</span></label><div class="input-shell"><span class="prefix">🍴</span><select id="category" name="category"><option value="">Select a category</option>${Object.keys(CATS).map(c=>`<option value="${c}" ${e?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><p class="error">Please select a category.</p></div><div class="field" id="dateField"><label for="date">Date <span class="required">*</span></label><div class="input-shell"><span class="prefix">▦</span><input type="date" id="date" name="date" value="${e?.date||today()}"></div><p class="error">Please select a valid date.</p></div><div class="field"><label for="description">Description (Optional)</label><div class="input-shell"><span class="prefix">✎</span><input id="description" name="description" maxlength="160" placeholder="e.g. lunch with team" value="${e?esc(e.description):''}"></div></div><div class="form-actions"><button type="button" class="secondary" data-back>Cancel</button><button type="submit" class="primary">${e?'Save Changes':'Save'}</button></div></form></div>`}
function history(){let items=sorted().filter(e=>(!filter||e.category===filter)&&(!search||[e.category,e.description,e.date].join(' ').toLowerCase().includes(search.toLowerCase())));return hero('Expense History','Review and manage your spending')+`<div class="topline"><span class="eyebrow">${items.length} expense${items.length===1?'':'s'}</span><button class="primary" data-add>＋ Add Expense</button></div><div class="section-head"><h2>All Expenses</h2></div><div class="filters"><input id="searchInput" aria-label="Search expenses" placeholder="Search expenses…" value="${esc(search)}"><select id="categoryFilter" aria-label="Filter category"><option value="">All categories</option>${Object.keys(CATS).map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="historyResults" class="expense-list">${items.length?items.map(expenseItem).join(''):empty()}</div>`}
function summary(){const choices=[['Today','today'],['This Week','week'],['This Month','month']];const t=total(period);const subset=expenses.filter(e=>period==='today'?e.date===today():period==='week'?e.date>=startWeek()&&e.date<=today():e.date.slice(0,7)===today().slice(0,7));return hero('Spending Summary','Understand where your money goes')+`<div class="summary-grid">${choices.map(([n,k])=>`<div class="summary-box"><span>${n}</span><strong>${money(total(k))}</strong></div>`).join('')}</div><div class="section-head"><h2>Category Breakdown</h2></div><div class="filters"><select id="periodFilter" aria-label="Summary period">${choices.map(([n,k])=>`<option value="${k}" ${period===k?'selected':''}>${n}</option>`).join('')}</select></div>${t?`<div class="breakdown">${Object.entries(CATS).map(([c,o])=>{const v=subset.filter(e=>e.category===c).reduce((s,e)=>s+Number(e.amount),0);return v?`<div class="break-row"><span>${o.icon} ${c}</span><div class="track"><div class="fill" style="width:${v/t*100}%"></div></div><strong style="text-align:right">${money(v)}</strong></div>`:''}).join('')}</div>`:empty()}`}
function settings(){return hero('Settings','Keep things simple')+`<section class="settings-card"><h2>About your data</h2><p>Expenses are saved in this browser on this device. No account, cloud sync or server is used. Clearing your browser storage may remove your expenses.</p><p><strong>${expenses.length}</strong> saved expense${expenses.length===1?'':'s'} · Currency: SGD</p><hr style="border:0;border-top:1px solid #e7e9f2;margin:25px 0"><h3>Start fresh</h3><p>Delete all recorded expenses, including the sample entries. This cannot be undone.</p><button class="danger" id="clearAll">Delete All Expenses</button></section>`}
function render(){nav();$('#appView').innerHTML=view==='Home'?dashboard():view==='Form'?form():view==='History'?history():view==='Summary'?summary():settings()}
function openForm(id=null){editing=id;view='Form';render();window.scrollTo(0,0);$('#amount')?.focus()}
function validate(){let ok=true;const amount=Number($('#amount').value);const validAmount=$('#amount').value.trim()!==''&&Number.isFinite(amount)&&amount>0;const validCat=Object.hasOwn(CATS,$('#category').value);const d=$('#date').value;const validDate=/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+'T12:00:00').getTime());for(const [id,valid] of [['amountField',validAmount],['categoryField',validCat],['dateField',validDate]]){$('#'+id).classList.toggle('invalid',!valid);if(!valid)ok=false}return ok}
function confirmAction(title,message,action,buttonText='Delete'){const dialog=$('#confirmDialog');$('#dialogTitle').textContent=title;$('#dialogText').textContent=message;$('#dialogConfirm').textContent=buttonText;$('#dialogConfirm').onclick=()=>{dialog.close();action()};dialog.showModal()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.hasAttribute('data-add')){openForm();return}if(b.hasAttribute('data-back')){go('Home');return}if(b.dataset.edit){openForm(b.dataset.edit);return}if(b.dataset.delete){const id=b.dataset.delete;confirmAction('Delete expense?','Are you sure you want to delete this expense? This action cannot be undone.',()=>{expenses=expenses.filter(e=>e.id!==id);persist();render();notify('Expense deleted')});return}if(b.id==='clearAll'){confirmAction('Delete all expenses?','This permanently removes every expense saved in this browser.',()=>{expenses=[];persist();render();notify('All expenses deleted')},'Delete All');return}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='expenseForm')return;ev.preventDefault();if(!validate())return;const e=editing?expenses.find(x=>x.id===editing):null;const entry={id:e?.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),amount:Math.round(Number($('#amount').value)*100)/100,category:$('#category').value,date:$('#date').value,description:$('#description').value.trim(),createdAt:e?.createdAt||new Date().toISOString()};if(e)expenses=expenses.map(x=>x.id===editing?entry:x);else expenses.push(entry);persist();go('Home');notify(e?'Expense updated':'Expense saved')});
document.addEventListener('input',ev=>{if(ev.target.closest('.field'))ev.target.closest('.field').classList.remove('invalid');if(ev.target.id==='searchInput'){search=ev.target.value;const items=sorted().filter(e=>(!filter||e.category===filter)&&[e.category,e.description,e.date].join(' ').toLowerCase().includes(search.toLowerCase()));$('#historyResults').innerHTML=items.length?items.map(expenseItem).join(''):empty()}});
document.addEventListener('change',ev=>{if(ev.target.id==='categoryFilter'){filter=ev.target.value;render();$('#searchInput')?.focus()}if(ev.target.id==='periodFilter'){period=ev.target.value;render()}});
$('#dialogCancel').onclick=()=>$('#confirmDialog').close();render();
})();
</script></body></html>
